plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dilaluva.tv'
    compileSdk 34

    defaultConfig {
        applicationId "com.dilaluva.tv"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Alinea todas las piezas de Kotlin a una sola versión (evita clases duplicadas)
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.24')
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
